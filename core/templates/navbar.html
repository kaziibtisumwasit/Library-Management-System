<nav class="bg-gray-900 shadow-md">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">

        <div class="flex h-12 items-center justify-between">

            <!-- Logo -->
            <a href="{% url 'home' %}"
               class="text-lg font-bold text-white">
                Library Management
            </a>


            <!-- Mobile Button -->
            <button
                type="button"
                onclick="document.getElementById('navbarMenu').classList.toggle('hidden')"
                class="rounded-md p-1.5 text-gray-300 hover:bg-gray-800 md:hidden">

                <svg
                    class="h-5 w-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24">

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M4 6h16M4 12h16M4 18h16">
                    </path>

                </svg>

            </button>

        </div>


        <!-- Menu -->
        <div
            id="navbarMenu"
            class="hidden border-t border-gray-700 py-2 md:flex md:items-center md:justify-between md:border-0 md:py-0">

            <!-- Left Menu -->
            <div class="flex flex-col md:flex-row md:items-center">

                <a
                    href="{% url 'home' %}"
                    class="rounded px-3 py-1.5 text-sm font-medium text-white hover:bg-gray-800">
                    Home
                </a>

                <a
                    href="{% url 'add_book' %}"
                    class="rounded px-3 py-1.5 text-sm font-medium text-gray-300 hover:bg-gray-800 hover:text-white">
                    Add Book
                </a>

                <a
                    href="{% url 'add_category' %}"
                    class="rounded px-3 py-1.5 text-sm font-medium text-gray-300 hover:bg-gray-800 hover:text-white">
                    Add Category
                </a>

            </div>


            <!-- Right Menu -->
            <div class="mt-2 md:mt-0">

                {% if request.user.is_authenticated %}

                    <div class="flex flex-col md:flex-row md:items-center md:gap-3">

                        <!-- Balance -->
                        <span class="px-3 py-1.5 text-sm text-white">
                            Balance:
                            <strong>
                                ৳{{ request.user.userprofile.balance }}
                            </strong>
                        </span>


                        <!-- User Dropdown -->
                        <div class="relative">

                            <button
                                type="button"
                                onclick="document.getElementById('userDropdown').classList.toggle('hidden')"
                                class="flex items-center rounded px-3 py-1.5 text-sm text-gray-300 hover:bg-gray-800 hover:text-white">

                                {{ request.user.first_name|default:request.user.username }}

                                <svg
                                    class="ml-1 h-4 w-4"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24">

                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M19 9l-7 7-7-7">
                                    </path>

                                </svg>

                            </button>


                            <!-- Dropdown -->
                            <div
                                id="userDropdown"
                                class="absolute right-0 z-50 mt-2 hidden w-52 rounded-md bg-white py-1 shadow-lg">

                                <a
                                    href="{% url 'profile_update' %}"
                                    class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                    Profile
                                </a>

                                <a
                                    href="{% url 'borrowing_history' %}"
                                    class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                    Borrowing History
                                </a>

                                <a
                                    href="{% url 'deposite' %}"
                                    class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                    Deposit Money
                                </a>

                                <hr class="my-1">

                                <a
                                    href="{% url 'user_logout' %}"
                                    class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                                    Logout
                                </a>

                            </div>

                        </div>

                    </div>

                {% else %}

                    <div class="flex flex-col gap-1 md:flex-row">

                        <a
                            href="{% url 'user_login' %}"
                            class="rounded px-3 py-1.5 text-sm font-medium text-gray-300 hover:bg-gray-800 hover:text-white">
                            Login
                        </a>

                        <a
                            href="{% url 'user_registration' %}"
                            class="rounded bg-blue-600 px-3 py-1.5 text-sm font-semibold text-white hover:bg-blue-700">
                            Register
                        </a>

                    </div>

                {% endif %}

            </div>

        </div>

    </div>
</nav>
